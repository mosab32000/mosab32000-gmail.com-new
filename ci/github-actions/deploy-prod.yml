name: Deploy to Production (Jordan Residency Cluster — Dual Control)

on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: "Immutable signed release tag"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Signed Tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "20"
          cache: "npm"
      - name: Production Readiness Gate
        run: npm ci && npm run type-check && npm run lint && npm test && npm run build
      - name: Progressive Canary Rollout
        run: echo "Deploying signed release ${{ inputs.releaseTag }} to Jordan production cluster with automatic SLO rollback guard."
