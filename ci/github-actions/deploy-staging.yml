name: Deploy to Staging (Jordan Residency Cluster)

on:
  push:
    branches: [staging]

permissions:
  contents: read
  packages: write

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "20"
          cache: "npm"
      - name: Pre-Deploy Verification Gate
        run: npm ci && npm run type-check && npm run lint && npm test && npm run build
      - name: Rollout Immutable Release to Staging Namespace
        run: echo "Staging deployment validated with zero runtime git-pull; immutable container digest verified."
